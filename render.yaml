services:
  - type: web
    name: mood-music-backend
    env: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true

  - type: web
    name: mood-music-frontend
    env: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npx serve -s dist
    autoDeploy: true